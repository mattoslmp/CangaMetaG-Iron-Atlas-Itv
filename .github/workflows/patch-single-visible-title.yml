name: Patch single visible app title

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-single-visible-title.yml

permissions:
  contents: write

jobs:
  patch-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicated article title from overview card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")
          duplicate = '      <h2 style="margin-top:0;color:#0f3f3c;">{html_lib.escape(str(title))}</h2>\n'
          expected_title = "Iron-rich Amazonian lateritic lake sediments harbor diverse microbial communities with biogeochemical potential relevant to carbon and methane cycling"

          if text.count(duplicate) != 1:
            raise SystemExit(f"Expected exactly one duplicated overview title, found {text.count(duplicate)}")
          if expected_title not in text:
            raise SystemExit("Expected article title was not found in app.py")

          path.write_text(text.replace(duplicate, "", 1), encoding="utf-8")
          PY

          python -m py_compile app.py

      - name: Commit the correction and remove this temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-single-visible-title.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/patch-single-visible-title.yml
          git commit -m "Show a single article title in the app"
          git push origin main
