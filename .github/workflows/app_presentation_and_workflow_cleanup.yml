name: Apply atlas presentation and workflow cleanup

on:
  push:
    paths:
      - '.github/workflows/app_presentation_and_workflow_cleanup.yml'
      - 'scripts/apply_one_time_presentation_cleanup.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install plotting dependency
        run: python -m pip install --upgrade matplotlib

      - name: Apply presentation cleanup
        run: python scripts/apply_one_time_presentation_cleanup.py

      - name: Validate Python syntax
        run: python -m py_compile app.py scripts/generate_atlas_workflow_figure.py

      - name: Regenerate workflow figure
        run: python scripts/generate_atlas_workflow_figure.py

      - name: Commit corrected app and workflow outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/generate_atlas_workflow_figure.py
          git add outputs/final_publication_figures/SupplementaryFigure29_complete_computational_workflow.*
          git add outputs/app_supplementary_figures/SupplementaryFigure29_complete_computational_workflow.*
          git add outputs/article_highres_figures/SupplementaryFigure29_complete_computational_workflow.*
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Improve atlas overview and separate workflow numbering'
            git push
          fi
