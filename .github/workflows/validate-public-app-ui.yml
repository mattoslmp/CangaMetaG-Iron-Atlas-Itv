name: Validate public app UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "app_core.py"
      - "src/app_*_transform.py"
      - "tests/test_public_scientific_traceability_only.py"
      - "scripts/validate_generated_streamlit_source.py"
      - ".github/workflows/validate-public-app-ui.yml"

permissions:
  contents: read

jobs:
  validate-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Compile generated Streamlit source
        run: python scripts/validate_generated_streamlit_source.py

      - name: Verify public scientific-only traceability
        run: python -m pytest -q tests/test_public_scientific_traceability_only.py
