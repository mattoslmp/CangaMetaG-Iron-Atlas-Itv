name: Run one-time workflow, language and figure-page corrections

on:
  push:
    paths:
      - '.github/workflows/run_one_time_workflow_language_pages_palette.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install workflow figure dependency
        run: python -m pip install --disable-pip-version-check matplotlib

      - name: Apply application corrections
        run: python scripts/one_time_fix_workflow_language_pages_palette.py

      - name: Regenerate workflow figure
        run: python scripts/generate_atlas_workflow_figure.py

      - name: Verify corrected application
        run: |
          python -m py_compile app.py src/supplementary_database.py scripts/generate_atlas_workflow_figure.py
          ! grep -F 'Show all {available} modules in this set' app.py
          grep -F 'Number of displayed modules' app.py
          grep -F 'Additional figure pages' app.py
          grep -F 'Taxon colours are loaded from the same canonical palette' app.py
          grep -F 'Study overview, workflow, traceability and core inventories.' app.py
          grep -F 'body=None' scripts/generate_atlas_workflow_figure.py
          test -s outputs/app_supplementary_figures/SupplementaryFigure29_complete_computational_workflow.png

      - name: Commit final corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/run_one_time_workflow_language_pages_palette.yml
          git rm scripts/one_time_fix_workflow_language_pages_palette.py
          git add app.py src/supplementary_database.py scripts/generate_atlas_workflow_figure.py outputs/final_publication_figures/SupplementaryFigure29_complete_computational_workflow.* outputs/app_supplementary_figures/SupplementaryFigure29_complete_computational_workflow.* outputs/article_highres_figures/SupplementaryFigure29_complete_computational_workflow.*
          git commit -m 'Fix workflow layout, language cards and multi-page figures'
          git push
