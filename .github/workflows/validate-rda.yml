name: Validate article RDA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  rda:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install compact RDA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas

      - name: Reproduce the article RDA from derived source matrices
        run: python scripts/run_article_rda_from_derived.py

      - name: Verify article statistics and trace-metal predictors
        run: |
          python - <<'PY'
          import json
          import subprocess

          output = subprocess.check_output(
            ['python', 'scripts/run_article_rda_from_derived.py'],
            text=True,
          )
          result = json.loads(output)
          expected_predictors = ['Fe2O3', 'SiO2', 'Al2O3', 'TOT/S', 'Cu', 'Pb']
          assert result['n_positions'] == 10
          assert result['predictors'] == expected_predictors
          assert abs(result['constrained_R2'] - 0.6605827831733045) < 1e-12
          assert abs(result['pseudo_F'] - 0.9731132518103737) < 1e-12
          assert abs(result['permutation_P'] - 0.534) < 1e-12
          print('Article RDA validation: PASS')
          PY

  apply-sampling-map-layout:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/sampling-map-layout-v4'
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/sampling-map-layout-v4
          fetch-depth: 0

      - name: Apply app-only sampling-map layout
        run: python scripts/one_time_sampling_map_layout.py

      - name: Validate and commit correction
        shell: bash
        run: |
          python -m py_compile app.py scripts/one_time_sampling_map_layout.py
          test -f outputs/final_publication_figures/Figure1_sampling_map.png
          test -f outputs/final_publication_figures/Figure1_sampling_map.pdf
          test -f outputs/final_publication_figures/Figure1_sampling_map.svg
          grep -F 'taxonomy_active_sampling_map' app.py
          grep -F 'Figure1_sampling_map.png' app.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply_sampling_map_layout.yml
          git rm scripts/one_time_sampling_map_layout.py
          git rm -f .github/sampling_map_layout_trigger_v4.txt
          git add app.py .github/workflows/validate-rda.yml
          changed="$(git diff --cached --name-only | sort)"
          expected=".github/sampling_map_layout_trigger_v4.txt
.github/workflows/apply_sampling_map_layout.yml
.github/workflows/validate-rda.yml
app.py
scripts/one_time_sampling_map_layout.py"
          test "$changed" = "$expected"
          git commit -m 'Place sampling maps in Streamlit app'
          git push origin HEAD:agent/sampling-map-layout-v4
