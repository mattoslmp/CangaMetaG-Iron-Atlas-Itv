name: Diagnose final scientific regressions

on:
  workflow_dispatch:
  push:
    branches:
      - fix/st8-excel-identifiers-final
    paths:
      - "src/**"
      - "tests/**"
      - "app.py"
      - ".github/workflows/diagnose-final-regressions.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "app.py"
      - ".github/workflows/diagnose-final-regressions.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy pandas matplotlib plotly openpyxl pillow pypdf pytest streamlit \
            cairosvg pycountry

      - name: Existing Figure 4 and Figure 5 regressions
        run: |
          python -m pytest -q \
            tests/test_article_figure45_final_generator.py \
            tests/test_figure45_legend_below_final.py

      - name: Existing ST8 and transform regressions
        run: |
          python -m pytest -q \
            tests/test_ko_heatmap_scale_selector.py \
            tests/test_st8_final_contract.py \
            tests/test_st8_mtx_value_diagnostics.py \
            tests/test_st8_scope_guard_and_antismash_bgc.py

      - name: Current taxonomy and strict below-five regressions
        run: |
          python -m pytest -vv \
            tests/test_taxonomy_final_contract.py

      - name: antiSMASH Supplementary Figure 68 regressions
        run: |
          python -m pytest -vv \
            tests/test_antismash_supplementary_figure.py

      - name: Self-contained visitor map regressions
        run: |
          python -m pytest -vv \
            tests/test_visitor_self_contained_map.py

      - name: Compile final application modules
        run: |
          python -m py_compile \
            app.py \
            src/taxonomy_final_contract.py \
            src/final_taxonomy_static_figures.py \
            src/antismash_supplementary_figure.py \
            src/visitor_self_contained_map.py \
            src/app_final_script_manifest_transform.py \
            src/app_final_taxonomy_lt5_current_transform.py \
            src/app_antismash_supplementary_figure_transform.py \
            src/app_visitor_map_city_final_transform.py
