name: Validate global heatmap selector V5

on:
  pull_request:
    branches:
      - main
    paths:
      - "app.py"
      - "src/app_ko_heatmap_scale_selector_transform.py"
      - "tests/test_ko_heatmap_scale_selector.py"
      - ".github/workflows/validate-global-heatmap-selector-v5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selector-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Compile and install global selector
        run: python -m pytest -q tests/test_ko_heatmap_scale_selector.py::test_transform_installs_one_selector_for_all_explicit_heatmap_pairs

      - name: Detect every explicit heatmap pair
        run: python -m pytest -q tests/test_ko_heatmap_scale_selector.py::test_pair_detection_is_generic_and_not_limited_to_ko_heatmaps

      - name: Convert functional selector
        run: python -m pytest -q tests/test_ko_heatmap_scale_selector.py::test_functional_annotation_selector_uses_standard_labels_across_lines

      - name: Convert taxonomy and generic selectors
        run: python -m pytest -q tests/test_ko_heatmap_scale_selector.py::test_taxonomy_and_generic_single_heatmaps_use_standard_selector

      - name: Preserve scientific metadata
        run: python -m pytest -q tests/test_ko_heatmap_scale_selector.py::test_selected_heatmap_keeps_specific_scientific_metadata

      - name: Describe selected plotted values
        run: python -m pytest -q tests/test_ko_heatmap_scale_selector.py::test_plotted_values_tab_receives_view_specific_description

      - name: Confirm final transform order
        run: python -m pytest -q tests/test_ko_heatmap_scale_selector.py::test_selector_is_last_transform_in_application_chain
