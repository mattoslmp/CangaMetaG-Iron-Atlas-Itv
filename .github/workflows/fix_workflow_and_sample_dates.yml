name: Fix atlas workflow and sample dates

on:
  push:
    paths:
      - '.github/workflows/fix_workflow_and_sample_dates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch files
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('scripts/generate_atlas_workflow_figure.py')
          text = workflow.read_text(encoding='utf-8')

          text, subtitle_count = re.subn(
            r"\n\s*ax\.text\(\n\s*0\.5,\n\s*0\.928,\n\s*'From curated scientific data layers to interactive exploration, publication figures, and reproducible analysis scripts',\n\s*ha='center',\n\s*va='top',\n\s*fontsize=11\.2,\n\s*color=COLORS\['muted'\],\n\s*\)\n",
            '\n',
            text,
            count=1,
          )

          stage_pattern = re.compile(
            r"\s*rounded_box\(\n\s*ax, 0\.035, 0\.625, 0\.265, 0\.235,\n\s*COLORS\['teal_soft'\], COLORS\['teal'\],\n\s*'Scientific data layers',\n\s*number=1,\n\s*\)\n"
            r"\s*pill\(ax, 0\.060, 0\.775, 0\.105, 'Study metadata'.*?\n"
            r"\s*pill\(ax, 0\.175, 0\.775, 0\.100, 'Sample context'.*?\n"
            r"\s*pill\(ax, 0\.060, 0\.715, 0\.105, 'Taxonomic profiles'.*?\n"
            r"\s*pill\(ax, 0\.175, 0\.715, 0\.100, 'KO profiles'.*?\n"
            r"\s*pill\(ax, 0\.060, 0\.655, 0\.105, 'MAG annotations'.*?\n"
            r"\s*pill\(ax, 0\.175, 0\.655, 0\.100, 'Iron-rich studies'.*?\n",
            re.DOTALL,
          )
          stage_replacement = """
          rounded_box(
            ax, 0.035, 0.625, 0.265, 0.235,
            COLORS['teal_soft'], COLORS['teal'],
            'Scientific data layers',
            'Study metadata\\nSample context\\nTaxonomic profiles\\nKO profiles\\nMAG annotations\\nIron-rich studies',
            number=1,
            body_size=9.4,
          )
          """
          text, stage_count = stage_pattern.subn(stage_replacement, text, count=1)
          if stage_count != 1:
            raise SystemExit(f'Could not replace Scientific data layers block: {stage_count}')
          workflow.write_text(text, encoding='utf-8')

          metadata = Path('src/sample_metadata.py')
          text = metadata.read_text(encoding='utf-8')
          dates_block = '''

          _COLLECTION_DATES = {
            "AM.P1.D": "2016-09-29",
            "AM.P1.R": "2016-03-29",
            "AM.P2.D": "2016-09-20",
            "AM.P2.R": "2016-03-29",
            "TIA.P1.D": "2016-09-21",
            "TIA.P1.R": "2016-03-30",
            "TIA.P2.D": "2016-09-21",
            "TIA.P2.R": "2016-03-30",
            "TI.P1.D": "2016-09-21",
            "TI.P1.R": "2016-03-30",
            "TI.P2.D": "2016-09-21",
            "TI.P2.R": "2016-03-30",
            "TI.P3.D": "2016-09-21",
            "TI.P3.R": "2016-03-30",
            "TI.P4.D": "2016-09-21",
            "TI.P4.R": "2016-03-30",
            "VI.P1.D": "2016-09-20",
            "VI.P1.R": "2016-03-29",
            "VI.P2.D": "2016-09-20",
            "VI.P2.R": "2016-03-29",
          }
          '''
          if '_COLLECTION_DATES = {' not in text:
            text = text.replace(']\n\n_SITE_COORDINATES = {', ']' + dates_block + '\n_SITE_COORDINATES = {', 1)
          text = text.replace(
            '      "collection_date": "Not reported in packaged metadata",',
            '      "collection_date": _COLLECTION_DATES.get(sample_id, ""),'
          )
          metadata.write_text(text, encoding='utf-8')

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')
          text = text.replace(
            'f"Seasonal distribution: **{n_dry} dry-season samples** and **{n_rainy} rainy-season samples**."',
            'f"Seasonal distribution: **{n_dry} dry-season samples** and **{n_rainy} rainy-season samples**. Collection dates for all **{total_samples} samples** are shown below."',
            1,
          )
          text = text.replace(
            'f"Distribuição sazonal: **{n_dry} amostras do período seco** e **{n_rainy} amostras do período chuvoso**."',
            'f"Distribuição sazonal: **{n_dry} amostras do período seco** e **{n_rainy} amostras do período chuvoso**. As datas de coleta das **{total_samples} amostras** estão apresentadas abaixo."',
            1,
          )
          old = '''    cols = [c for c in ["sample.id", "collection_date", "lake", "season", "lat", "lon", "environment_feature"] if c in meta.columns]
              show_table(meta[cols], "metadata_preview", height=320)'''
          new = '''    st.markdown("##### " + txt("Datas de coleta das 20 amostras", "Collection dates for the 20 samples"))
              cols = [c for c in ["sample.id", "collection_date", "lake", "season", "lat", "lon", "environment_feature"] if c in meta.columns]
              sample_details = meta[cols].drop_duplicates().reset_index(drop=True)
              show_table(sample_details, "metadata_preview", height=720)'''
          if old not in text:
            raise SystemExit('Could not find the sample detail table block in app.py')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install plotting dependency
        run: python -m pip install --upgrade matplotlib

      - name: Regenerate workflow figure
        run: python scripts/generate_atlas_workflow_figure.py

      - name: Validate changes
        run: |
          python -m py_compile app.py src/sample_metadata.py scripts/generate_atlas_workflow_figure.py
          python - <<'PY'
          from src.sample_metadata import amazonian_sample_metadata
          frame = amazonian_sample_metadata()
          assert len(frame) == 20
          assert frame['sample.id'].nunique() == 20
          assert frame['collection_date'].astype(str).str.match(r'^2016-\d{2}-\d{2}$').all()
          assert (frame['season'] == 'Dry').sum() == 10
          assert (frame['season'] == 'Rainy').sum() == 10
          print(frame[['sample.id', 'collection_date', 'lake', 'season']].to_string(index=False))
          PY

      - name: Commit corrected app and figures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py src/sample_metadata.py scripts/generate_atlas_workflow_figure.py
          git add outputs/final_publication_figures/SupplementaryFigure29_complete_computational_workflow.*
          git add outputs/app_supplementary_figures/SupplementaryFigure29_complete_computational_workflow.*
          git add outputs/article_highres_figures/SupplementaryFigure29_complete_computational_workflow.*
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Fix workflow stage 1 and add 20 collection dates'
            git push
          fi
